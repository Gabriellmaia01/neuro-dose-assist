name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (High/Critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Spring Boot integration tests
        run: chmod +x mvnw && ./mvnw -B test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no hardcoded secrets in tracked files
        run: |
          if git grep -nE "mongodb\+srv://[^/\s]+:[^@\s]+@|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----" -- ':!.env.example' ':!.agent/**'; then
            echo "::error::Possível segredo encontrado em arquivo rastreado pelo Git!"
            exit 1
          fi
