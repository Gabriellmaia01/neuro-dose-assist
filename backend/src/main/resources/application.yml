server:
  port: ${PORT:8080}
  tomcat:
    max-http-form-post-size: 262144
    max-swallow-size: 262144

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/neurodose}
      database: ${MONGODB_DATABASE:neurodose}
      auto-index-creation: true

app:
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:${VITE_FIREBASE_PROJECT_ID:}}
    jwk-set-uri: ${FIREBASE_JWK_SET_URI:https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:5173,http://localhost:4173,http://localhost:8080}
  security:
    max-payload-bytes: ${MAX_PAYLOAD_BYTES:262144}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      public-rpm: ${RATE_LIMIT_PUBLIC_RPM:60}
      api-rpm: ${RATE_LIMIT_API_RPM:300}
